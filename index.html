<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>My Favourite Movies</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto&display=swap" rel="stylesheet">
    <style>
        body { --primary: #6200ee; --secondary: #29b6f6; margin: 0px;}
        * {font-family: 'Roboto', sans-serif;}
        button { 
            -webkit-font-smoothing: antialiased;
            display: inline-block;
            text-decoration: none;
            margin: 2px;
            color: var(--primary);
            background: white;
            border: 1px solid var(--primary);
            height: 20px;
            font-size: 9px;
            text-transform: uppercase;
            cursor: pointer;
            transition: ease-in 0.2s all;
            padding: 0 8px 0 8px;
        }
        div#main {padding: 10px;}
        input {margin-bottom: 5px; margin-top: 2px; padding: 4px; font-size: 12px; }
        h1 {background: var(--primary); color: white; font-weight: 300; text-transform: uppercase; font-size: 20px; margin: 0px; padding: 15px;}
        h2 { margin-block-start: 0px; margin-block-end: 10px; font-size: 20px;  color: var(--primary);}
        button:hover { background: var(--primary); color: white; }
        div.actions { margin-top: 10px;}
        
        /* Uniform Movie Card Sizing */
        div.movie {display: inline-block; width: 220px; vertical-align: top; padding: 10px; box-shadow: 2px 2px 7px #ccc; margin: 5px; background: white; box-sizing: border-box;}
        div.movie div.movie-img {width: 200px; height: 300px; overflow: hidden; cursor: pointer; display: flex; align-items: center; justify-content: center; background: #f0f0f0;}
        div.movie div.movie-img img {width: 100%; height: 100%; object-fit: cover;}
        div.movie div.title {text-align: center; overflow: hidden; text-overflow: ellipsis; width: 200px; white-space: nowrap; margin-top: 8px;}
        div.field {color: var(--primary); text-transform: uppercase; font-size: 12px;}

        /* Detail Card Sizing */
        .movie-detail-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 2px 2px 10px #ccc;
            display: flex;
            gap: 20px;
            max-width: 600px;
            align-items: center;
        }
        .movie-detail-img img {
            width: 180px;
            border-radius: 4px;
            box-shadow: 1px 1px 5px #aaa;
        }
        .movie-detail-info {
            flex: 1;
        }
        .movie-detail-info .field-value {
            font-size: 13px;
            color: #333;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 3px;
        }
    </style>

    <script type="text/javascript">

       // DATA MODEL

       let initial_movies = [
        { title: "Superlópez", director: "Javier Ruiz Caldera", thumbnail: "files/superlopez.png" },
        { title: "Jurassic Park", director: "Steven Spielberg", thumbnail: "files/jurassicpark.png" },
        { title: "Interstellar", director: "Christopher Nolan", thumbnail: "files/interstellar.png" }
    ];

        localStorage.my_movies = localStorage.my_movies || JSON.stringify(initial_movies);

        // VIEWS
        const indexView = (movies) => {
            let i=0;
            let view = "";

            while(i < movies.length) {
              view += `
                <div class="movie">
                   <div class="movie-img">
                        <img data-my-id="${i}" class="show" src="${movies[i].thumbnail}" onerror="this.src='files/noimage.png'"/>
                   </div>
                   <div class="title">
                        ${movies[i].title || "<em>No title</em>"}
                   </div>
                   <div class="actions">
                        <button class="show" data-my-id="${i}">Show</button>
                        <button class="edit" data-my-id="${i}">Edit</button>
                        <button class="delete" data-my-id="${i}">Delete</button>
                   </div>
                </div>\n`;
              i = i + 1;
            };

            view += `<div class="actions">
                        <button class="new">Add Movie</button>
                        <button class="reset">Reset</button>
                        <button class="search-menu">Search API</button>
                    </div>`;

            return view;
        };

        const editView = (i, movie) => {
            return `<h2>Edit Movie </h2>
                <div class="field">
                Title <br>
                <input type="text" id="title" placeholder="Title" value="${movie.title}">
                </div>
                <div class="field">
                Director <br>
                <input type="text" id="director" placeholder="Director" value="${movie.director}">
                </div>
                <div class="field">
                Thumbnail <br>
                <input type="text" id="thumbnail" placeholder="Thumbnail URL" value="${movie.thumbnail}">
                </div>
                <div class="actions">
                    <button class="update" data-my-id="${i}">Update</button>
                    <button class="index">Back</button>
                </div>`;
        }

        const showView = (movie) => {
            return `
            <div class="movie-detail-card">
                <div class="movie-detail-img">
                    <img src="${movie.thumbnail}" onerror="this.src='files/noimage.png'" alt="${movie.title}">
                </div>
                <div class="movie-detail-info">
                    <h2>${movie.title || "<em>No title</em>"}</h2>
                    
                    <div class="field">Director</div>
                    <div class="field-value">${movie.director || "<em>No director</em>"}</div>
                    
                    <div class="field">Thumbnail URL</div>
                    <div class="field-value">${movie.thumbnail || "<em>No thumbnail</em>"}</div>

                    <div class="actions">
                        <button class="index">Back</button>
                    </div>
                </div>
            </div>`;
        }

        const newView = () => {
            return `<h2>Create Movie</h2>
                <div class="field">
                Title <br>
                <input type="text" id="title" placeholder="Title">
                </div>
                <div class="field">
                Director <br>
                <input type="text" id="director" placeholder="Director">
                </div>
                <div class="field">
                Thumbnail <br>
                <input type="text" id="thumbnail" placeholder="Thumbnail URL">
                </div>
                <div class="actions">
                    <button class="create">Create</button>
                    <button class="index">Back</button>
                </div>`;
        }

        const searchView = (errorMessage = "") => {
            return `
                <h2>Search Movies on TMDb</h2>
                <div class="field">
                    Movie Title <br>
                    <input type="text" id="search_query" placeholder="Enter movie title...">
                </div>
                ${errorMessage ? `<p style="color: red; font-size: 12px; margin-top: 5px;">${errorMessage}</p>` : ''}
                <div class="actions">
                    <button class="search-submit">Search</button>
                    <button class="index">Back</button>
                </div>`;
        };

        const resultsView = (movies) => {
            let view = "<h2>Search Results</h2>";
            if (!movies || movies.length === 0) {
                return view + `
                    <p style="color: #555;">No movies found matching your search term.</p>
                    <div class="actions">
                        <button class="search-menu">Back to Search</button>
                        <button class="index">Back to Home</button>
                    </div>`;
            }

            let i = 0;
            while (i < movies.length) {
                let movie = movies[i];
                let posterUrl = movie.poster_path ? `https://image.tmdb.org/t/p/w200${movie.poster_path}` : 'files/noimage.png';
                view += `
                    <div class="movie">
                         <div class="movie-img">
                              <img src="${posterUrl}" onerror="this.src='files/noimage.png'"/>
                         </div>
                         <div class="title">
                              ${movie.title || "<em>No title</em>"}
                         </div>
                         <div class="actions">
                              <button class="add-api" data-api-id="${i}">Add to Local</button>
                         </div>
                    </div>`;
                i++;
            }

            view += `<div class="actions"><button class="search-menu">Back to Search</button></div>`;
            return view;
        };

        // CONTROLLERS 
        const indexContr = () => {
         let my_movies = JSON.parse(localStorage.my_movies);
         document.getElementById('main').innerHTML = indexView(my_movies);
         };

        const showContr = (i) => {
            let movie = JSON.parse(localStorage.my_movies)[i];
            document.getElementById('main').innerHTML = showView(movie);
        };

        const newContr = () => {
            document.getElementById('main').innerHTML = newView();
        };

        const createContr = () => {
            let title = document.getElementById('title').value.trim();
            let director = document.getElementById('director').value.trim();
            let thumbnail = document.getElementById('thumbnail').value.trim();

            if (!title && !director && !thumbnail) {
                alert("Please fill in at least one field to create a movie.");
                return;
            }

            let my_movies = JSON.parse(localStorage.my_movies);
            let newMovie = {
                title: title,
                director: director,
                thumbnail: thumbnail
            };
            my_movies.push(newMovie);
            localStorage.my_movies = JSON.stringify(my_movies);
            indexContr();
        };

        const editContr = (i) => {
            let movie = JSON.parse(localStorage.my_movies)[i];
            document.getElementById('main').innerHTML = editView(i, movie);
        };

        const updateContr = (i) => {
            let my_movies = JSON.parse(localStorage.my_movies);
            my_movies[i].title    = document.getElementById('title').value;
            my_movies[i].director  = document.getElementById('director').value;
            my_movies[i].thumbnail = document.getElementById('thumbnail').value;
            localStorage.my_movies = JSON.stringify(my_movies);
            indexContr();
        };

        const deleteContr = (i) => {
            let my_movies = JSON.parse(localStorage.my_movies);
            if (confirm("Are you sure you want to delete this movie?")) {
                my_movies.splice(i, 1);
                localStorage.my_movies = JSON.stringify(my_movies);
                indexContr();
            }
        };

        const resetContr = () => {
            localStorage.my_movies = JSON.stringify(initial_movies);
            indexContr();
        };

        const searchMenuContr = () => {
            document.getElementById('main').innerHTML = searchView();
        };

        const searchContr = (query) => {
            if (query === undefined) {
                let queryField = document.getElementById('search_query');
                query = queryField ? queryField.value : "";
            }

            if (!query.trim()) {
                document.getElementById('main').innerHTML = searchView("⚠️ Please enter a valid movie title to search.");
                return;
            }

            const apiKey = '50995afb71e03e294f6ead5219eb29fa'; 
            let url = `https://api.themoviedb.org/3/search/movie?api_key=${apiKey}&query=${encodeURIComponent(query)}`;

            document.getElementById('main').innerHTML = "<p>Loading search results...</p>";

            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`API Error: Status ${response.status} (${response.statusText})`);
                    }
                    return response.json();
                })
                .then(data => {
                    window.lastSearchResults = data.results;
                    document.getElementById('main').innerHTML = resultsView(data.results);
                })
                .catch(error => {
                    console.error("Network or API error:", error);
                    document.getElementById('main').innerHTML = `
                        <h2>Search Error</h2>
                        <p style="color: red; font-size: 14px;">⚠️ A network or API issue occurred: ${error.message}. Please check your internet connection or API key and try again.</p>
                        <div class="actions">
                            <button class="search-menu">Back to Search</button>
                            <button class="index">Back to Home</button>
                        </div>`;
                });
        };

        const addFromAPIContr = (i) => {
            let selectedMovie = window.lastSearchResults[i];
            const apiKey = '50995afb71e03e294f6ead5219eb29fa';
            
            let detailUrl = `https://api.themoviedb.org/3/movie/${selectedMovie.id}?api_key=${apiKey}&append_to_response=credits`;

            document.getElementById('main').innerHTML = "<p>Adding movie and fetching details...</p>";

            fetch(detailUrl)
                .then(response => {
                    if (!response.ok) throw new Error("Failed to fetch movie details");
                    return response.json();
                })
                .then(details => {
                    let director = "Unknown";
                    if (details.credits && details.credits.crew) {
                        let dirObj = details.credits.crew.find(person => person.job === "Director");
                        if (dirObj) {
                            director = dirObj.name;
                        }
                    }

                    let posterUrl = details.poster_path 
                        ? `https://image.tmdb.org/t/p/w200${details.poster_path}` 
                        : (selectedMovie.poster_path ? `https://image.tmdb.org/t/p/w200${selectedMovie.poster_path}` : "files/noimage.png");

                    let newMovie = {
                        title: details.title || selectedMovie.title || "No Title",
                        director: director,
                        thumbnail: posterUrl
                    };

                    let my_movies = JSON.parse(localStorage.my_movies);

                    let exists = my_movies.some(movie => movie.title.toLowerCase() === newMovie.title.toLowerCase());
                    if (exists) {
                        alert(`"${newMovie.title}" is already in your local database!`);
                        indexContr();
                        return;
                    }

                    my_movies.push(newMovie);
                    localStorage.my_movies = JSON.stringify(my_movies);
                    alert(`"${newMovie.title}" has been added to your movies!`);
                    indexContr();
                })
                .catch(error => {
                    console.error("Error fetching movie details:", error);
                    let newMovie = {
                        title: selectedMovie.title || "No Title",
                        director: "TMDb Import",
                        thumbnail: selectedMovie.poster_path ? `https://image.tmdb.org/t/p/w200${selectedMovie.poster_path}` : "files/noimage.png"
                    };

                    let my_movies = JSON.parse(localStorage.my_movies);
                    let exists = my_movies.some(movie => movie.title.toLowerCase() === newMovie.title.toLowerCase());
                    if (exists) {
                        alert(`"${newMovie.title}" is already in your local database!`);
                        indexContr();
                        return;
                    }

                    my_movies.push(newMovie);
                    localStorage.my_movies = JSON.stringify(my_movies);
                    alert(`"${newMovie.title}" has been added to your movies!`);
                    indexContr();
                });
        };

        // EVENT ROUTER
        const matchEvent = (ev, sel) => ev.target.matches(sel);
        const myId = (ev) => Number(ev.target.dataset.myId);
        const apiId = (ev) => Number(ev.target.dataset.apiId);

        document.addEventListener('click', ev => {
            if      (matchEvent(ev, '.index'))  indexContr  ();
            else if (matchEvent(ev, '.edit'))   editContr   (myId(ev));
            else if (matchEvent(ev, '.update')) updateContr (myId(ev));
            else if (matchEvent(ev, '.show'))   showContr   (myId(ev));
            else if (matchEvent(ev, '.delete')) deleteContr (myId(ev));
            else if (matchEvent(ev, '.new'))    newContr    ();
            else if (matchEvent(ev, '.create')) createContr ();
            else if (matchEvent(ev, '.reset'))  resetContr  ();
            else if (matchEvent(ev, '.search-menu')) searchMenuContr ();
            else if (matchEvent(ev, '.search-submit')) searchContr ();
            else if (matchEvent(ev, '.add-api')) addFromAPIContr (apiId(ev));
        })

        // Initialization        
        document.addEventListener('DOMContentLoaded', indexContr);
    </script>
</head>

<body>

    <h1>My Favourite Movies</h1>
    <div id="main"> <!-- The view is included here --> </div>

</body>
</html>
